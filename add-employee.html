<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll System - Add Employee</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Payroll System</h2>
            <ul>
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="add-employee.html" class="active">Add Employee</a></li>
                <li><a href="view-employees.html">View Employees</a></li>
                <li><a href="salary-reports.html">Salary Reports</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>Add New Employee</h1>
                <div class="user-info">
                    <span>Welcome, Admin</span>
                </div>
            </div>
            
            <div id="message" class="message"></div>
            
            <div class="card">
                <form id="addEmployeeForm">
                    <div class="form-row">
                        <div class="form-col">
                            <label for="name">Full Name *</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-col">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-col">
                            <label for="position">Position *</label>
                            <input type="text" id="position" name="position" required>
                        </div>
                        <div class="form-col">
                            <label for="department">Department *</label>
                            <select id="department" name="department" required>
                                <option value="">Select Department</option>
                                <option value="IT">IT</option>
                                <option value="HR">HR</option>
                                <option value="Finance">Finance</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Sales">Sales</option>
                                <option value="Operations">Operations</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-col">
                            <label for="salary">Monthly Salary ($) *</label>
                            <input type="number" id="salary" name="salary" step="0.01" min="0" required>
                        </div>
                        <div class="form-col">
                            <label for="join_date">Join Date *</label>
                            <input type="date" id="join_date" name="join_date" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn">Add Employee</button>
                    <a href="admin-dashboard.html" class="btn" style="background-color: #6c757d; text-decoration: none; display: inline-block; text-align: center; margin-top: 1rem;">Back to Dashboard</a>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/script.js"></script>
    <script>
        // Set default join date to today
        document.getElementById('join_date').valueAsDate = new Date();
        
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
